# LedgerPay API — OpenAPI 3.0 spec (canonical source of truth)
#
# Покрывает маршруты из routes/api_v1.php (стабильный контракт /api/v1):
#   Health (2), Auth (4), Customers (3), Accounts (5), Transactions (6)
#
# Конвенции:
#   - суммы в minor units (100.50 RUB = 10050)
#   - ошибки: application/problem+json + request_id
#   - money movement: обязателен заголовок Idempotency-Key
#   - POST transactions: 201 (создание), 200 (idempotent replay)
#   - Transaction.status: pending, processing, completed, failed (+ cancelled зарезервирован)
#
# Swagger UI: GET /api/docs (при API_DOCS_ENABLED=true)

openapi: 3.0.3

info:
  title: LedgerPay API
  version: 1.0.0
  description: |
    REST API fintech ledger (учёт и движение денег). Laravel 13, PostgreSQL, Redis Queue, Sanctum.

    `info.version` — версия **описания** OpenAPI, не релиз приложения (см. CHANGELOG).

    Суммы — в минорных единицах (100.50 RUB = 10050).

    POST-транзакции: **201** при создании, **200** при idempotent replay
    (тот же `Idempotency-Key`).

    Статусы транзакции: `pending`, `processing`, `completed`, `failed`
    (`cancelled` зарезервирован, в MVP не используется).

    Тип операции в JSON: `deposit`, `withdrawal`, `transfer`.

    Ошибки — Problem Details (`application/problem+json`, стиль RFC 7807)
    с полем `request_id` (корреляция с заголовком `X-Request-Id`, опционально).

    Ответы включают заголовок `X-API-Version: v1`.
    Legacy `/api/*` (без v1) — deprecated; см. docs/api-versioning.md.

    Списки (index) — Laravel pagination: `data`, `links`, `meta`.
    GET `/transactions/{uuid}` — исключение: объект транзакции **в корне** JSON.

servers:
  - url: http://localhost/api/v1
    description: Локальная среда (v1)
  - url: http://localhost:8080/api/v1
    description: Локальная среда (Sail, v1)

tags:
  - name: Health
    description: Работоспособность и Готовность (Liveness/readiness) (без Bearer token)
  - name: Auth
    description: Регистрация, вход, Sanctum token
  - name: Customers
    description: Клиенты (в основном backoffice)
  - name: Accounts
    description: Счета, баланс, ledger
  - name: Transactions
    description: Движение денег и retry

# Bearer token (Sanctum) для всех endpoints, кроме register/login и health
security:
  - bearerAuth: []

paths:
  # ─── Health ─────────────────────────────────────────────────────────
  /health/live:
    get:
      security: [ ]
      summary: Проверка жизнеспособности
      tags: [ Health ]
      responses:
        "200":
          description: Приложение работает
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthLiveResponse"

  /health/ready:
    get:
      security: [ ]
      summary: Проверка готовности
      tags: [ Health ]
      responses:
        "200":
          description: Приложение готово или деградировано (warning)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyResponse"
        "503":
          description: Приложение не готово (failed)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthReadyResponse"

  # ─── Auth ───────────────────────────────────────────────────────────
  /auth/register:
    post:
      security: []
      summary: Регистрация клиента
      tags: [Auth]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [name, email, password]
              type: object
              properties:
                name: { type: string, example: Alice Morgan }
                email: { type: string, format: email, example: alice@example.com }
                password: { type: string, format: password, example: StrongPassword123! }
      responses:
        "201":
          description: Зарегистрирован, выдан token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthRegisterResponse"
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/login:
    post:
      security: []
      summary: Вход
      tags: [Auth]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [email, password]
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, example: cli }
      responses:
        "200":
          description: Токен выдан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthLoginResponse"
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/me:
    get:
      summary: Текущий пользователь
      tags: [Auth]
      parameters:
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Профиль пользователя и customer (если есть)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMeResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      summary: Выход
      tags: [Auth]
      responses:
        "200":
          description: Токен отозван
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ─── Customers (backoffice) ───────────────────────────────────────
  /customers:
    get:
      summary: Список клиентов (backoffice)
      tags: [Customers]
      responses:
        "200":
          description: Страница клиентов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedCustomers"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      summary: Создание клиента (backoffice)
      tags: [Customers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [name, email]
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /customers/{uuid}:
    get:
      summary: Карточка клиента
      tags: [Customers]
      parameters: [{ $ref: "#/components/parameters/Uuid" }]
      responses:
        "200":
          description: Клиент
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ─── Accounts ─────────────────────────────────────────────────────
  /accounts:
    get:
      summary: Список счетов
      tags: [Accounts]
      responses:
        "200":
          description: Страница счетов
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAccounts"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    post:
      summary: Создание счёта
      tags: [Accounts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [currency]
              type: object
              properties:
                customer_uuid:
                  type: string
                  format: uuid
                  description: Только для backoffice
                currency: { type: string, example: RUB }
      responses:
        "201":
          description: Создан
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /accounts/{uuid}:
    get:
      summary: Карточка счёта
      tags: [Accounts]
      parameters: [{ $ref: "#/components/parameters/Uuid" }]
      responses:
        "200":
          description: Счёт
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /accounts/{uuid}/balance:
    get:
      summary: Баланс
      tags: [Accounts]
      parameters: [{ $ref: "#/components/parameters/Uuid" }]
      responses:
        "200":
          description: Баланс в minor units
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBalanceResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /accounts/{uuid}/ledger:
    get:
      summary: Записи ledger
      tags: [Accounts]
      parameters: [{ $ref: "#/components/parameters/Uuid" }]
      responses:
        "200":
          description: Страница проводок ledger
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedLedgerEntries"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  # ─── Transactions (money movement + idempotency) ────────────────────
  /transactions:
    get:
      summary: Список транзакций
      tags: [Transactions]
      responses:
        "200":
          description: Страница транзакций
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedTransactions"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /transactions/deposit:
    post:
      summary: Пополнение
      description: POST 201 — новая pending-транзакция; 200 — idempotent replay (тело в `data`).
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [target_account_uuid, amount, currency]
              type: object
              properties:
                target_account_uuid: { type: string, format: uuid }
                amount: { type: integer, description: Минорные единицы, example: 100000 }
                currency: { type: string, example: RUB }
      responses:
        "201":
          description: Транзакция создана (pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEnvelope"
        "200":
          description: Существующая транзакция (idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/DomainRuleViolation" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /transactions/withdraw:
    post:
      summary: Списание
      description: POST 201 — новая pending-транзакция; 200 — idempotent replay (тело в `data`).
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [source_account_uuid, amount, currency]
              type: object
              properties:
                source_account_uuid: { type: string, format: uuid }
                amount: { type: integer, example: 25000 }
                currency: { type: string, example: RUB }
      responses:
        "201":
          description: Транзакция создана (pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEnvelope"
        "200":
          description: Существующая транзакция (idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/DomainRuleViolation" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /transactions/transfer:
    post:
      summary: Перевод
      description: POST 201 — новая pending-транзакция; 200 — idempotent replay (тело в `data`).
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required: [source_account_uuid, target_account_uuid, amount, currency]
              type: object
              properties:
                source_account_uuid: { type: string, format: uuid }
                target_account_uuid: { type: string, format: uuid }
                amount: { type: integer, example: 10000 }
                currency: { type: string, example: RUB }
      responses:
        "201":
          description: Транзакция создана (pending)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEnvelope"
        "200":
          description: Существующая транзакция (idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/DomainRuleViolation" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /transactions/{uuid}:
    get:
      summary: Транзакция
      description: |
        Возвращает объект транзакции **в корне JSON** (без обёртки `data`).
        Список, create и retry используют обёртку `data`.
      tags: [Transactions]
      parameters: [{ $ref: "#/components/parameters/Uuid" }]
      responses:
        "200":
          description: Транзакция
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /transactions/{uuid}/retry:
    post:
      summary: Повтор failed-транзакции
      description: |
        Сбрасывает Failed → Pending и ставит job в очередь.
        Если статус не `failed`, возвращает **200** с текущей транзакцией (без повторного dispatch).
      tags: [Transactions]
      parameters:
        - $ref: "#/components/parameters/Uuid"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Транзакция в очереди или без изменений
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionEnvelope"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

# ─── Reusable components ──────────────────────────────────────────────
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Sanctum token из /auth/login или /auth/register

  parameters:
    Uuid:
      name: uuid
      in: path
      required: true
      description: Публичный UUID ресурса (не numeric id)
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Обязателен для POST /transactions/deposit, /withdraw, /transfer
      schema: { type: string }
      example: deposit-demo-001
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Correlation ID (если не передан — генерируется сервером)
      schema: { type: string, format: uuid }

  responses:
    ValidationError:
      description: HTTP 422 — ошибка валидации FormRequest
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    NotFound:
      description: HTTP 404 — ресурс не найден
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Forbidden:
      description: HTTP 403 — недостаточно прав (Policy)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    Unauthenticated:
      description: HTTP 401 — требуется Bearer token
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    DomainRuleViolation:
      description: HTTP 409 — недостаточно средств, неактивный счёт и др. (доменные правила)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }
    TooManyRequests:
      description: HTTP 429 — превышен rate limit (auth, API, money movement)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetails" }

  schemas:
    HealthLiveResponse:
      type: object
      required: [status, checked_at]
      properties:
        status: { type: string, enum: [ok] }
        checked_at: { type: string, format: date-time }

    HealthReadyResponse:
      type: object
      required: [status, checked_at, checks]
      properties:
        status:
          type: string
          enum: [ok, warning, failed]
          description: warning — деградация, но HTTP 200; failed — HTTP 503
        checked_at: { type: string, format: date-time }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticCheck"

    DiagnosticCheck:
      type: object
      properties:
        name: { type: string, example: database }
        status: { type: string, enum: [ok, warning, failed] }
        message: { type: string }
        context:
          type: object
          additionalProperties: true

    AuthUserSummary:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        is_backoffice: { type: boolean }

    AuthRegisterResponse:
      type: object
      properties:
        token_type: { type: string, example: Bearer }
        access_token: { type: string }
        user:
          type: object
          properties:
            name: { type: string }
            email: { type: string, format: email }
        customer:
          $ref: "#/components/schemas/Customer"

    AuthLoginResponse:
      type: object
      properties:
        token_type: { type: string, example: Bearer }
        access_token: { type: string }
        user:
          $ref: "#/components/schemas/AuthUserSummary"

    AuthMeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/AuthUserSummary"
        customer:
          description: null для backoffice-пользователя без customer
          oneOf:
            - $ref: "#/components/schemas/Customer"
            - type: "null"

    MessageResponse:
      type: object
      properties:
        message: { type: string, example: Successfully logged out }

    Customer:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        status: { type: string, example: active }
        created_at: { type: string, format: date-time, nullable: true }

    Account:
      type: object
      properties:
        uuid: { type: string, format: uuid }
        customer_uuid: { type: string, format: uuid, nullable: true }
        currency: { type: string, example: RUB }
        balance: { type: integer, description: Минорные единицы }
        status: { type: string, example: active }
        created_at: { type: string, format: date-time, nullable: true }

    AccountBalanceResponse:
      type: object
      properties:
        account_uuid: { type: string, format: uuid }
        balance: { type: integer }
        currency: { type: string }

    LedgerEntry:
      type: object
      properties:
        transaction_uuid: { type: string, format: uuid, nullable: true }
        account_uuid: { type: string, format: uuid, nullable: true }
        direction: { type: string, enum: [debit, credit] }
        amount: { type: integer }
        currency: { type: string }
        balance_after: { type: integer }
        created_at: { type: string, format: date-time }

    Transaction:
      description: Формат GET /transactions/{uuid} (объект в корне JSON)
      type: object
      properties:
        uuid: { type: string, format: uuid }
        type: { type: string, enum: [deposit, withdrawal, transfer] }
        status:
          type: string
          enum: [pending, processing, completed, failed, cancelled]
          description: |
            pending — ожидает worker; processing — в обработке;
            completed / failed — терминальные; cancelled — зарезервирован (MVP не использует).
        source_account_uuid: { type: string, format: uuid, nullable: true }
        target_account_uuid: { type: string, format: uuid, nullable: true }
        amount: { type: integer, description: Минорные единицы }
        currency: { type: string }
        failure_reason: { type: string, nullable: true }
        processed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    TransactionEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Transaction"

    CustomerEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Customer"

    AccountEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Account"

    PaginationLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }

    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        path: { type: string }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }

    PaginatedCustomers:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Customer"
        links:
          $ref: "#/components/schemas/PaginationLinks"
        meta:
